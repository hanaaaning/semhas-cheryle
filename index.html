<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canva Access Test V4</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin:0; font-family:Arial,Helvetica,sans-serif; background:#f5f6fa;
      color:#172033; min-height:100vh; display:grid; place-items:center; padding:20px;
    }
    .card {
      width:min(560px,100%); background:#fff; padding:32px; border-radius:22px;
      box-shadow:0 14px 50px rgba(0,0,0,.08);
    }
    .badge {
      display:inline-block; padding:7px 12px; border-radius:999px;
      background:#eee7ff; color:#6d28d9; font-weight:700; font-size:13px;
    }
    h1 { margin:16px 0 8px; font-size:30px; }
    p { color:#5d6677; line-height:1.55; }
    label { display:block; margin:20px 0 8px; font-weight:700; }
    input {
      width:100%; padding:14px 15px; border:1px solid #d5d9e2;
      border-radius:12px; font-size:15px; outline:none;
    }
    input:focus { border-color:#7c3aed; }
    button {
      width:100%; margin-top:14px; padding:14px 18px; border:0; border-radius:12px;
      background:#7c3aed; color:#fff; font-size:16px; font-weight:700; cursor:pointer;
    }
    button:disabled { background:#c8cad1; cursor:not-allowed; }
    .result,.valid,.error {
      margin-top:20px; padding:16px; border-radius:14px;
    }
    .result { display:none; background:#f7f8fb; }
    .valid { display:none; background:#ecfdf5; color:#065f46; }
    .error { display:none; background:#fff1f2; color:#9f1239; }
    .link {
      word-break:break-all; padding:12px; border-radius:10px; background:#fff;
      border:1px solid #e0e3ea; margin-top:10px; font-size:14px;
    }
    .copy { margin-top:10px; background:#111827; }
    .open { margin-top:10px; }
    .note { margin-top:14px; font-size:12px; color:#7b8491; line-height:1.5; }
  </style>
</head>
<body>
<main class="card" id="app">
  <span class="badge">TEST V4</span>
  <h1>Canva Premium Access</h1>
  <p>
    Demo online. Link akses dibuat dengan token di URL sehingga bisa dibuka dari
    HP, laptop, atau perangkat lain.
  </p>

  <label for="email">Email Canva</label>
  <input id="email" type="email" placeholder="contoh@gmail.com" autocomplete="email">
  <button id="createBtn" disabled>Buat Link Akses Unik</button>

  <section class="result" id="result">
    <strong>Link akses unik Anda:</strong>
    <div class="link" id="accessLink"></div>
    <button class="copy" id="copyBtn">Salin Link</button>
    <button class="open" id="openBtn">Buka Link Akses</button>
    <div class="note">
      Versi ini hanya untuk tes. Token belum disimpan di database dan belum
      dikunci ke email di server.
    </div>
  </section>
</main>

<script>
const INVITE_URL =
  "https://www.canva.com/brand/join?token=Qan3Z0E4Us2Hvep4sDtLMQ&invitationDestinationType=group";

const emailInput = document.getElementById("email");
const createBtn = document.getElementById("createBtn");
const result = document.getElementById("result");
const accessLink = document.getElementById("accessLink");
const copyBtn = document.getElementById("copyBtn");
const openBtn = document.getElementById("openBtn");

function validEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function makeToken() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let token = "";
  for (let i = 0; i < 10; i++) {
    token += chars[Math.floor(Math.random() * chars.length)];
  }
  return token;
}

function baseUrl() {
  return window.location.origin + window.location.pathname;
}

function updateButton() {
  createBtn.disabled = !validEmail(emailInput.value.trim());
}

emailInput.addEventListener("input", updateButton);
updateButton();

createBtn.addEventListener("click", () => {
  const email = emailInput.value.trim().toLowerCase();
  if (!validEmail(email)) return;

  // Demo token: email tidak ditampilkan di URL.
  // Untuk produksi, mapping token-email disimpan di server/database.
  const token = makeToken();
  const url = baseUrl() + "?access=" + token;

  accessLink.textContent = url;
  result.style.display = "block";

  openBtn.onclick = () => {
    window.location.href = url;
  };

  copyBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(url);
      copyBtn.textContent = "Link Tersalin ✓";
      setTimeout(() => copyBtn.textContent = "Salin Link", 1400);
    } catch {
      prompt("Salin link berikut:", url);
    }
  };
});

// Halaman akses: tidak memakai localStorage.
// Karena ini demo statis, perangkat lain dapat membuka token yang sama.
const params = new URLSearchParams(window.location.search);
const access = params.get("access");

if (access) {
  document.getElementById("app").innerHTML = `
    <span class="badge">LINK AKSES VALID</span>
    <h1>Akses Canva</h1>
    <p>Token akses terdeteksi: <strong>${access}</strong></p>
    <div class="valid" style="display:block">
      Link ini bisa dibuka dari perangkat lain karena tidak bergantung pada
      penyimpanan browser pembuat link.
    </div>
    <button id="joinCanva">Lanjut ke Canva</button>
    <div class="note">
      DEMO SAJA: semua token berbentuk benar akan diterima. Pada versi produksi,
      server akan mengecek token, email, pembayaran, masa aktif, dan status slot.
    </div>
  `;

  document.getElementById("joinCanva").onclick = () => {
    window.location.href = INVITE_URL;
  };
}
</script>
</body>
</html>
