<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canva Access V5</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;font-family:Arial,sans-serif;color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(620px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:0 15px 55px rgba(0,0,0,.08)}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#eee7ff;color:#6d28d9;font-weight:700;font-size:13px}h1{margin:16px 0 8px}p{line-height:1.55;color:#5d6677}.box{margin-top:20px;padding:18px;border-radius:14px;background:#f7f8fb}.info{background:#eef2ff}.warn{background:#fff7ed;color:#9a3412}.danger{background:#fff1f2;color:#9f1239}.ok{background:#ecfdf5;color:#065f46}button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#111827}button.danger-btn{background:#be123c}button:disabled{background:#c9cbd2;cursor:not-allowed}.small{font-size:12px;color:#7b8491}
</style></head><body><main class="card" id="app"><span class="badge">CANVA ACCESS V5</span><h1>Memeriksa akses...</h1><p>Tunggu sebentar.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="PASTE_SUPABASE_URL",SUPABASE_KEY="PASTE_SUPABASE_PUBLISHABLE_KEY",INVITE_URL="PASTE_CANVA_INVITE_URL";
const app=document.getElementById("app"),sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const t=new URLSearchParams(location.search).get("access");
function err(x){app.innerHTML=`<span class="badge">ERROR</span><h1>Akses tidak tersedia</h1><div class="box danger">${esc(x)}</div>`}
async function reset(){const b=document.getElementById("reset"),m=document.getElementById("msg");b.disabled=true;b.textContent="Mengirim...";const{error}=await sb.rpc("request_reset",{p_access_token:t,p_reason:"Salah akun Canva"});m.innerHTML=error?`<div class="box danger">${esc(error.message)}</div>`:`<div class="box ok">Permintaan reset tercatat. Admin dapat mereset token setelah mengeluarkan akun yang salah dari Team.</div>`;b.disabled=false;b.textContent="Salah akun Canva — Ajukan Reset"}
async function load(){if(!SUPABASE_URL.startsWith("http")||SUPABASE_KEY.includes("PASTE_"))return err("Isi SUPABASE_URL dan publishable/anon key di index.html.");if(INVITE_URL.includes("PASTE_"))return err("Isi link undangan Canva di index.html.");if(!t)return err("Token akses tidak ditemukan.");const{data,error}=await sb.rpc("open_access",{p_access_token:t});if(error||!data?.length)return err("Token tidak ditemukan atau tidak berlaku.");const x=data[0];
if(x.status==="USED"){app.innerHTML=`<span class="badge">SUDAH DIGUNAKAN</span><h1>Akses sudah digunakan</h1><div class="box info"><b>Order:</b> ${esc(x.order_code)}<br><b>Email:</b> ${esc(x.customer_email)}</div><button id="reset" class="danger-btn">Salah akun Canva — Ajukan Reset</button><div id="msg"></div>`;document.getElementById("reset").onclick=reset;return}
app.innerHTML=`<span class="badge">${x.status==="PENDING"?"MENUNGGU KONFIRMASI":"AKSES SIAP"}</span><h1>Akses Canva</h1><div class="box info"><b>Order:</b> ${esc(x.order_code)}<br><b>Email pembelian:</b> ${esc(x.customer_email)}</div><div class="box warn"><b>PENTING</b><br>Pastikan akun Canva yang sedang login adalah:<br><b>${esc(x.customer_email)}</b></div><button id="join">Lanjut ke Canva</button><button id="confirm" class="secondary">Saya sudah masuk dengan akun yang benar</button><p class="small">Website tidak dapat membaca akun Canva setelah redirect. Karena itu status USED dipasang setelah Anda menekan konfirmasi.</p><div id="msg"></div>`;
document.getElementById("join").onclick=()=>location.href=INVITE_URL;
document.getElementById("confirm").onclick=async()=>{const{error}=await sb.rpc("confirm_access",{p_access_token:t});if(error)return document.getElementById("msg").innerHTML=`<div class="box danger">${esc(error.message)}</div>`;app.innerHTML=`<span class="badge">USED</span><h1>Akses tercatat</h1><div class="box ok">Token sekarang berstatus USED.</div><button id="reset" class="danger-btn">Salah akun Canva — Ajukan Reset</button><div id="msg"></div>`;document.getElementById("reset").onclick=reset}}
load();
</script></body></html>
