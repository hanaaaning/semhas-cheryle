<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canva Access V5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;font-family:Arial,sans-serif;color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(620px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:0 15px 55px rgba(0,0,0,.08)}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#eee7ff;color:#6d28d9;font-weight:700;font-size:13px}
h1{margin:16px 0 8px;font-size:30px}
p{line-height:1.55;color:#5d6677}
.box{margin-top:20px;padding:18px;border-radius:14px;background:#f7f8fb}
.info{background:#eef2ff}
.warn{background:#fff7ed;color:#9a3412}
.danger{background:#fff1f2;color:#9f1239}
.ok{background:#ecfdf5;color:#065f46}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button.secondary{background:#111827}
button.danger-btn{background:#be123c}
button:disabled{background:#c9cbd2;cursor:not-allowed}
.small{font-size:12px;color:#7b8491}
</style>
</head>
<body>
<main class="card" id="app">
  <span class="badge">CANVA ACCESS V5.1</span>
  <h1>Memeriksa akses...</h1>
  <p>Tunggu sebentar.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://yxybbsbjvtkpwcazairg.supabase.co";
const SUPABASE_KEY = "sb_publishable_CqIJY0Dpwuvb6eF_wO-Axw_LjHi7jEz";
const INVITE_URL = "https://www.canva.com/brand/join?token=Qan3Z0E4Us2Hvep4sDtLMQ&invitationDestinationType=group";

const app = document.getElementById("app");
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const token = new URLSearchParams(location.search).get("access");

const esc = s => String(s).replace(/[&<>"']/g, m => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

function showError(message) {
  app.innerHTML = `
    <span class="badge">ERROR</span>
    <h1>Akses tidak tersedia</h1>
    <div class="box danger">${esc(message)}</div>
  `;
}

async function requestReset() {
  const button = document.getElementById("reset");
  const msg = document.getElementById("msg");
  button.disabled = true;
  button.textContent = "Mengirim...";

  const { error } = await sb.rpc("request_reset", {
    p_access_token: token,
    p_reason: "Salah akun Canva"
  });

  if (error) {
    msg.innerHTML = `<div class="box danger">${esc(error.message)}</div>`;
    button.disabled = false;
    button.textContent = "Salah akun Canva — Ajukan Reset";
    return;
  }

  msg.innerHTML = `
    <div class="box ok">
      Permintaan reset sudah tercatat. Admin dapat mereset token setelah akun yang salah dikeluarkan dari Team Canva.
    </div>
  `;
  button.textContent = "Reset Diminta";
}

async function confirmUsed() {
  const confirmBtn = document.getElementById("confirm");
  const msg = document.getElementById("msg");
  confirmBtn.disabled = true;
  confirmBtn.textContent = "Menyimpan...";

  const { data, error } = await sb.rpc("confirm_access", {
    p_access_token: token
  });

  if (error || data !== true) {
    msg.innerHTML = `<div class="box danger">${esc(error?.message || "Token belum bisa ditandai USED.")}</div>`;
    confirmBtn.disabled = false;
    confirmBtn.textContent = "Saya sudah masuk dengan akun yang benar";
    return;
  }

  app.innerHTML = `
    <span class="badge">USED</span>
    <h1>Akses tercatat</h1>
    <div class="box ok">
      Token sudah berubah menjadi <strong>USED</strong>.
    </div>
    <p>Jika ternyata Anda memakai akun Canva yang salah, ajukan reset di bawah.</p>
    <button id="reset" class="danger-btn">Salah akun Canva — Ajukan Reset</button>
    <div id="msg"></div>
  `;
  document.getElementById("reset").onclick = requestReset;
}

async function load() {
  if (!token) {
    showError("Token akses tidak ditemukan pada URL.");
    return;
  }

  const { data, error } = await sb.rpc("open_access", {
    p_access_token: token
  });

  if (error || !data || data.length === 0) {
    showError(error?.message || "Token tidak ditemukan atau tidak berlaku.");
    return;
  }

  const item = data[0];
  const status = item.access_status; // diperbaiki sesuai fungsi Supabase terbaru

  if (status === "USED") {
    app.innerHTML = `
      <span class="badge">SUDAH DIGUNAKAN</span>
      <h1>Akses sudah digunakan</h1>
      <div class="box info">
        <b>Order:</b> ${esc(item.order_code)}<br>
        <b>Email pembelian:</b> ${esc(item.customer_email)}
      </div>
      <p>Jika Anda salah akun Canva, ajukan reset. Tidak perlu membayar ulang.</p>
      <button id="reset" class="danger-btn">Salah akun Canva — Ajukan Reset</button>
      <div id="msg"></div>
    `;
    document.getElementById("reset").onclick = requestReset;
    return;
  }

  app.innerHTML = `
    <span class="badge">${status === "PENDING" ? "MENUNGGU KONFIRMASI" : "AKSES SIAP"}</span>
    <h1>Akses Canva</h1>
    <div class="box info">
      <b>Order:</b> ${esc(item.order_code)}<br>
      <b>Email pembelian:</b> ${esc(item.customer_email)}
    </div>
    <div class="box warn">
      <b>PENTING</b><br>
      Sebelum lanjut, pastikan akun Canva yang sedang login adalah:<br>
      <b>${esc(item.customer_email)}</b>
    </div>
    <button id="join">Lanjut ke Canva</button>
    <button id="confirm" class="secondary">Saya sudah masuk dengan akun yang benar</button>
    <p class="small">
      Website tidak dapat membaca sesi akun Canva setelah redirect.
      Status USED dicatat setelah konfirmasi Anda.
    </p>
    <div id="msg"></div>
  `;

  document.getElementById("join").onclick = () => {
    window.location.href = INVITE_URL;
  };
  document.getElementById("confirm").onclick = confirmUsed;
}

load();
</script>
</body>
</html>
